<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Player Gallery | FullTimeVisuals</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
        }

        /* NAVIGATION */

        .navbar {
            height: 75px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5, 5, 5, 0.95);
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .back {
            color: #aaa;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s ease;
        }

        .back:hover {
            color: white;
        }

        /* HEADER */

        .gallery-header {
            padding: 100px 7% 60px;
            text-align: center;
        }

        .small-title {
            font-size: 12px;
            letter-spacing: 5px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            letter-spacing: -3px;
        }

        .description {
            margin-top: 20px;
            color: #888;
        }

        /* PHOTO GRID */

        .gallery {
            padding: 0 7% 100px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .photo {
            aspect-ratio: 4 / 5;
            background: linear-gradient(135deg, #222, #080808);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .navbar {
                height: 65px;
                padding: 0 5%;
            }

            .logo {
                font-size: 14px;
            }

            .back {
                font-size: 9px;
            }

            .gallery-header {
                padding: 80px 5% 45px;
            }

            .gallery {
                padding: 0 5% 70px;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

        }

    </style>

</head>

<body>

    <!-- NAVIGATION -->

    <nav class="navbar">

        <div class="logo">
            FullTimeVisuals
        </div>

        <a href="index.html#gallery" class="back">
            ← Back to Players
        </a>

    </nav>


    <!-- GALLERY HEADER -->

    <section class="gallery-header">

        <div class="small-title">
            FullTimeVisuals
        </div>

        <h1 id="playerTitle">
            PLAYER GALLERY
        </h1>

        <p class="description">
            Season Photography
        </p>

    </section>


    <!-- PHOTO GALLERY -->

    <div class="gallery" id="gallery">

        <!-- Photos will go here -->

    </div>


    <script>

        const params = new URLSearchParams(window.location.search);

        const playerNumber = params.get("player") || "1";

        document.getElementById("playerTitle").textContent =
            "PLAYER " + playerNumber + " GALLERY";

    </script>

</body>

</html>
